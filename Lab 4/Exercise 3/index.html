<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Student CRUD System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .form-section {
            padding: 2rem;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0.5rem;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .table-section {
            padding: 2rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        tr:hover { background: #f8f9fa; }
        .status {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-weight: 500;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background: #e2e3e5; color: #495057; }
        #loading { display: none; text-align: center; padding: 2rem; }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .action-btns button {
            padding: 6px 12px;
            font-size: 14px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍🎓 Student Management System</h1>
            <p>Full CRUD Operations with AJAX</p>
        </div>

        <div class="form-section">
            <div id="status" class="status" style="display: none;"></div>
            <form id="studentForm">
                <div class="form-grid">
                    <div>
                        <label>Student ID:</label>
                        <input type="text" id="studentId" placeholder="e.g., S001" required>
                    </div>
                    <div>
                        <label>Name:</label>
                        <input type="text" id="studentName" placeholder="John Doe" required>
                    </div>
                    <div>
                        <label>Department:</label>
                        <select id="department" required>
                            <option value="">Select Dept</option>
                            <option value="CSE">Computer Science</option>
                            <option value="ECE">Electronics</option>
                            <option value="MECH">Mechanical</option>
                            <option value="CIVIL">Civil</option>
                        </select>
                    </div>
                    <div>
                        <label>Marks (0-100):</label>
                        <input type="number" id="marks" min="0" max="100" placeholder="85" required>
                    </div>
                </div>
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-success">Add/Update Student</button>
                    <button type="button" id="clearBtn" class="btn">Clear</button>
                </div>
            </form>
        </div>

        <div class="table-section">
            <div id="loading">
                <span class="spinner"></span>Loading students...
            </div>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Simulated database (in real app, this would be your server)
        let studentsDB = [
            { id: 'S001', name: 'John Doe', dept: 'CSE', marks: 92 },
            { id: 'S002', name: 'Jane Smith', dept: 'ECE', marks: 87 },
            { id: 'S003', name: 'Mike Johnson', dept: 'MECH', marks: 78 },
            { id: 'S004', name: 'Sarah Wilson', dept: 'CSE', marks: 95 }
        ];

        let currentEditId = null;
        const API_BASE = '/api/students'; // Simulated endpoint

        document.addEventListener('DOMContentLoaded', () => {
            loadStudents();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('studentForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('clearBtn').addEventListener('click', clearForm);
        }

        // Simulate HTTP status codes
        function simulateServerResponse(operation, data = null) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    switch(operation) {
                        case 'READ':
                            resolve({ status: 200, data: studentsDB });
                        case 'CREATE':
                            if (studentsDB.find(s => s.id === data.id)) {
                                reject({ status: 409, message: 'Student ID already exists' });
                            } else {
                                studentsDB.unshift(data);
                                resolve({ status: 201, message: 'Student created successfully' });
                            }
                            break;
                        case 'UPDATE':
                            const index = studentsDB.findIndex(s => s.id === data.id);
                            if (index === -1) {
                                reject({ status: 404, message: 'Student not found' });
                            } else {
                                studentsDB[index] = data;
                                resolve({ status: 200, message: 'Student updated successfully' });
                            }
                            break;
                        case 'DELETE':
                            const delIndex = studentsDB.findIndex(s => s.id === data);
                            if (delIndex === -1) {
                                reject({ status: 404, message: 'Student not found' });
                            } else {
                                studentsDB.splice(delIndex, 1);
                                resolve({ status: 200, message: 'Student deleted successfully' });
                            }
                            break;
                    }
                }, 800);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            showLoading(true);

            const student = {
                id: document.getElementById('studentId').value.trim(),
                name: document.getElementById('studentName').value.trim(),
                dept: document.getElementById('department').value,
                marks: parseInt(document.getElementById('marks').value)
            };

            try {
                let response;
                if (currentEditId) {
                    response = await simulateServerResponse('UPDATE', student);
                    showStatus('Student updated successfully!', 'success');
                    currentEditId = null;
                } else {
                    response = await simulateServerResponse('CREATE', student);
                    showStatus('Student added successfully!', 'success');
                }
                loadStudents();
                clearForm();
            } catch (error) {
                showStatus(error.message || 'Operation failed', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function loadStudents() {
            showLoading(true);
            try {
                const response = await simulateServerResponse('READ');
                displayStudents(response.data);
            } catch (error) {
                showStatus('Failed to load students', 'error');
            } finally {
                showLoading(false);
            }
        }

        function displayStudents(students) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = students.map(student => `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.dept}</td>
                    <td>${student.marks}</td>
                    <td>${getGrade(student.marks)}</td>
                    <td class="action-btns">
                        <button class="btn" onclick="editStudent('${student.id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteStudent('${student.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function getGrade(marks) {
            if (marks >= 90) return 'A';
            if (marks >= 80) return 'B';
            if (marks >= 70) return 'C';
            return 'D';
        }

        function editStudent(id) {
            const student = studentsDB.find(s => s.id === id);
            if (student) {
                document.getElementById('studentId').value = student.id;
                document.getElementById('studentName').value = student.name;
                document.getElementById('department').value = student.dept;
                document.getElementById('marks').value = student.marks;
                currentEditId = id;
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            showLoading(true);
            try {
                const response = await simulateServerResponse('DELETE', id);
                showStatus(response.message, 'success');
                loadStudents();
            } catch (error) {
                showStatus(error.message || 'Delete failed', 'error');
            } finally {
                showLoading(false);
            }
        }

        function clearForm() {
            document.getElementById('studentForm').reset();
            currentEditId = null;
            hideStatus();
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            setTimeout(hideStatus, 3000);
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
