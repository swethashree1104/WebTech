<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="productCard.css">
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/200" alt="Product Image">

        <h3>Smart Watch</h3>

        <p class="description">
            Latest smart watch with fitness and health tracking features.
        </p>

        <p class="price">₹2999</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
