<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>👥 User Management System</h1>

    <div class="form-section">
        <h2>Register New User</h2>
        <form id="userForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <div id="nameError" class="error"></div>
            
            <input type="email" id="email" placeholder="Email Address" required>
            <div id="emailError" class="error"></div>
            
            <input type="tel" id="mobile" placeholder="Mobile Number (10 digits)" maxlength="10" required>
            <div id="mobileError" class="error"></div>
            
            <input type="password" id="password" placeholder="Password (min 6 chars)" required>
            <div id="passwordError" class="error"></div>
            
            <button type="submit">Register User</button>
        </form>
    </div>

    <div class="users-section">
        <div class="header-section">
            <h2>Registered Users</h2>
            <div class="stats">
                Total Users: <span id="userCount">0</span>
            </div>
            <button onclick="clearAllUsers()" class="danger">Clear All Users</button>
        </div>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Date Registered</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
